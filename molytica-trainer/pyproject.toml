[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "molytica-trainer"
version = "0.1.0"
description = "Local training server for molytica, exposing a FastAPI API for model training and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "click>=8.0",
    "scikit-learn>=1.3",
    "numpy",
    "pandas",
    "sse-starlette>=1.6",
    "python-multipart>=0.0.9",
    "torch>=2.0",
    "gensim>=4.0",
    "networkx>=3.0",
]

[project.scripts]
molytica-train = "molytica_trainer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
