# STAGE 2 — HTTPS. Install after `certbot certonly --webroot` has created the certificate.
# On the box: /etc/nginx/sites-available/molytica (replaces stage 1)

upstream molytica_frontend {
    server 127.0.0.1:3000;
}

upstream molytica_backend {
    server 127.0.0.1:8000;
}

# Port 80: answer certificate renewals, send everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name molytica.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Port 443: the real site.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name molytica.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/molytica.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/molytica.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tell browsers to use HTTPS only. Start at 1 day; raise to 31536000 (1 year) once stable.
    add_header Strict-Transport-Security "max-age=86400" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location /api/ {
        proxy_pass http://molytica_backend;
        client_max_body_size 200m;
        proxy_read_timeout   120s;
    }

    location / {
        proxy_pass http://molytica_frontend;
    }
}
