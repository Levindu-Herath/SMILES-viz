# STAGE 1 — HTTP only. Use until the Let's Encrypt certificate exists,
# then replace with molytica.conf (stage 2).
# On the box: /etc/nginx/sites-available/molytica

upstream molytica_frontend {
    server 127.0.0.1:3000;
}

upstream molytica_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name molytica.duckdns.org;

    # Headers every proxied request carries to the app containers.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Let's Encrypt HTTP-01 challenge files, written by `certbot --webroot`.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend: every FastAPI route already starts with /api/, so pass the URI unchanged.
    location /api/ {
        proxy_pass http://molytica_backend;
        client_max_body_size 200m;   # model uploads (datasets are 50 MB)
        proxy_read_timeout   120s;   # slow predictions / large upload processing
    }

    # Everything else: the Next.js frontend.
    location / {
        proxy_pass http://molytica_frontend;
    }
}
