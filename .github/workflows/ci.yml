name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  # Image jobs also Trivy-scan the image they just built. Callers of this
  # workflow (deploy.yml) must grant security-events: write for the SARIF upload.
  # The SARIF steps run even when tests or the gate fail, so findings always
  # reach the Security tab; fork PRs get a read-only token, so upload is skipped.
  backend-test:
    name: Backend tests (inside the production image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: smiles-viz-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: pytest inside the image
        run: >-
          docker run --rm smiles-viz-backend:ci
          sh -c "pip install -q -r requirements-dev.txt && python -m pytest -v -p no:cacheprovider"

      - name: Trivy SARIF report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: smiles-viz-backend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-backend.sarif
          exit-code: "0"

      - name: Upload SARIF to the Security tab
        if: >-
          ${{ !cancelled() && steps.build.outcome == 'success' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Trivy gate (fail on fixable CRITICAL/HIGH)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: smiles-viz-backend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - uses: docker/setup-buildx-action@v3

      # Runs next build inside the production Dockerfile, so the image Trivy
      # scans is the one we'd ship (instead of a separate host-side build).
      - name: Build frontend image (next build)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: smiles-viz-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy SARIF report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: smiles-viz-frontend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "0"

      - name: Upload SARIF to the Security tab
        if: >-
          ${{ !cancelled() && steps.build.outcome == 'success' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Trivy gate (fail on fixable CRITICAL/HIGH)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: smiles-viz-frontend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
